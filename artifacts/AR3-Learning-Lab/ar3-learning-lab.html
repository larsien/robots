<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A Colorfigures learning lab for AR3 joint commands, forward kinematics and inverse kinematics."><title>AR3 · From commands to joint motion</title></head><body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* VIEW turns the object in 90° steps about a vertical axis through its centre (RC):
   0 = front (+x) and left (+y) faces toward the viewer, 1 = turned once (the +y side becomes the front)…
   Figures keep modelling in their own coordinates; P / Dv / vis / tone / depthOf all apply the turn. */
let VIEW = 0, RC = [0, 0];
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];                 // the views the UI offers: front and back (figures still draw correctly in all four)
const rotV = ([x,y,z]) => { switch (VIEW & 3){ case 1: return [y,-x,z]; case 2: return [-x,-y,z]; case 3: return [-y,x,z]; default: return [x,y,z]; } };
const rotXY = (x,y) => { const r = rotV([x-RC[0], y-RC[1], 0]); return [r[0]+RC[0], r[1]+RC[1]]; };
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso, no turn
const P  = (x,y,z) => { const [a,b] = rotXY(x,y); return [(a-b)*C + OX, (a+b)*S - z + OY]; };
const Dv = (x,y,z) => { const [a,b,c] = rotV([x,y,z]); return [(a-b)*C, (a+b)*S - c]; };
// distance toward the viewer in the current view: draw parts with smaller depth first
const depthOf = p => { const [a,b] = rotXY(p[0],p[1]); return a + b + p[2]; };
// sort [{at:[x,y,z], svg}] back-to-front for the current view and join
const byDepth = parts => parts.filter(Boolean).sort((p,q) => depthOf(p.at) - depthOf(q.at)).map(p => p.svg).join('');
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
const tone  = (n,m) => { const d=dot(rotV(n),L);   return d>-.15 ? m.l : d>-.45 ? m.m : m.d; };   // exterior, follows the sun
const toneI = (n,m) => { const d=dot(rotV(n),LIN); return d>.6 ? m.l : d>.05 ? m.m : m.d; };      // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
const txM = (o, U, V) => `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K;
  const s = fill(sp(hull(pts3.map(([x,y,z]) => { const [a,b] = rotXY(x,y); return P0(a+(z-z0)*SH[0]*k, b+(z-z0)*SH[1]*k, z0); }))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  const k = INK_K, [X,Y] = P(...p3), fs = 8.6*k, w = text.length*fs*.62 + fs*1.5, h = fs*1.8, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */
const INK_REF_VB = 585;
let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

/* ---------- page shell ---------- */
const CORE_CSS = `
  :root{--paper:#f2efe7;--ink:#231e16;--muted:#857d6e;--rule:#ddd6c8}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .16 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    overflow-x:hidden;color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}
  header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.02em} header span{color:var(--muted)}
  #fig{width:100%;max-width:760px;height:auto;display:block;margin:4px 0 8px;user-select:none;overflow:visible}
  #fig [data-act]{cursor:pointer}
  #readout, .idea{display:none}   /* status line + big idea are off: the buttons and motion tell the story */
  .idea{width:100%;max-width:760px;margin:-6px 0 16px;font-size:12.5px;line-height:1.5;text-align:center;color:var(--ink)}
  .idea strong{letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-right:8px}
  #readout{position:relative;min-height:1.4em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;text-align:center;text-shadow:0 0 3px var(--paper),0 0 6px var(--paper),0 0 10px var(--paper)}
  .stage{position:relative;width:100%;max-width:760px}
  .actions{position:absolute;top:4px;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:2;max-width:220px}
  .actions .cap{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 2px}
  html.nolabels #fig .tag{display:none}
  .ctl[hidden]{display:none}
  /* ui.flash(text): a short note under the buttons ("the can is empty — refill it"); the status line itself stays hidden */
  .toast{position:absolute;left:0;z-index:3;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);
    border:1.5px solid var(--ink);border-radius:8px;padding:4px 9px;box-shadow:2px 2px 0 var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;max-width:240px}
  .toast.show{opacity:1}
  .made-with{width:100%;max-width:760px;margin-top:18px;text-align:right;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .made-with a{color:var(--muted);text-decoration:none} .made-with a:hover{color:var(--ink)}
  .stats{position:absolute;top:4px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:2;text-align:right}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat.small .v{font-size:20px}
  .stat .v.bump{animation:bump .35s ease-out}
  @keyframes bump{0%{transform:scale(1.18)}100%{transform:none}}
  .stepwrap{position:relative;display:flex;align-items:center;gap:8px}
  .act{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
  .act:hover{background:color-mix(in srgb,var(--paper) 92%,var(--ink))}
  .act .car{margin-left:6px;font-size:10px}
  .act:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .chips{display:none;flex-wrap:wrap;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);
    padding:8px;width:max-content;max-width:min(300px,62vw);position:absolute;left:calc(100% + 10px);top:-4px;z-index:3}
  .stepwrap.open .chips{display:flex}
  .chip{white-space:nowrap;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:4px 8px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .chip:hover{background:var(--accent,#f4b829);transform:translate(-1px,-1px)}
  .chip.current{background:var(--ink);color:var(--paper)} .chip.current:hover{background:var(--ink);transform:none}
  .chip.off{opacity:.45} .chip.off:hover{transform:none;background:var(--paper)}

  @media (max-width:560px){body{padding:14px 12px 24px}header span,.actions .cap{display:none}.actions{flex-direction:row;flex-wrap:wrap;gap:6px}.act{font-size:12px;padding:4px 11px}.stats{position:static;flex-direction:row;justify-content:flex-end;gap:18px;margin-bottom:4px}.actions{position:static;max-width:none;margin:6px 0 4px}.chips{left:0;top:calc(100% + 8px)}}
  .controls{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 28px;border-top:1px solid var(--rule);padding-top:16px}
  .ctl{display:flex;flex-direction:column;gap:6px}
  .ctl label{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  input[type=range]{width:100%;accent-color:var(--ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
  button:hover{background:#0000000d}
  .sw{width:26px;height:26px;padding:0;border-radius:50%} .sw[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}`;

const filterFor = k => `<filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${(0.045/k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>
  <feDisplacementMap id="wob" in="SourceGraphic" in2="warp" scale="${(2.4*k).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="wob"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.9/k).toFixed(4)}" numOctaves="3" seed="11" result="n1"/>
  <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.012/k).toFixed(4)}" numOctaves="2" seed="7" result="n2"/>
  <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .85  .3 0 0 0 .85  .3 0 0 0 .85  0 0 0 0 1" result="blot"/>
  <feBlend in="wob" in2="grain" mode="multiply" result="g1"/><feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
  <feComposite in="g2" in2="wob" operator="in"/></filter>`;

/* mountFigure({
     fig:'03', title:'Photo booth', hint:'click the curtain…',
     size:[W,D,H],                 // bounding box, used to frame the view (shadow range included)
     palette:'mustard',            // default PALS key
     state:{...},                  // figure state (st.pal is built in)
     scene: (st, m) => svgString,  // m = current palette {l,m,d}
     readout: st => 'text',        // status line under the figure
     buttons: [{label, onClick(st, ui)}      // listed in the order the user should do them
               | {label, choices: st => [{label, onClick(st,ui), current?, disabled?, why?}]}],   // opens a picker
     stats: st => [{label, value, small?}],   // optional: big numbers top-right (credit, change, score)
     credit: false,                // optional: hide the small "Made with Colorfigures" link
     acts: { name(st, el, ui){} },  // clicks on act(name, …) groups; el has dataset
     params(st, q){}               // optional: read URLSearchParams for screenshot states
   })  -> ui = { st, render, animate(stepFn), flash(text,ms) }
   animate(step): calls step(dt seconds) every frame and re-renders until step returns false. */
addEventListener('error', e => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + e.message + ';'; });
function mountFigure(cfg){
  document.title = cfg.title;
  const style = document.createElement('style'); style.textContent = CORE_CSS; document.head.appendChild(style);
  document.body.innerHTML = `
    <header><h1>Fig. ${cfg.fig} — ${cfg.title}</h1><span>${cfg.hint || ''}</span></header>
    <div class="stage">
      ${cfg.buttons && cfg.buttons.length ? `<div class="actions" id="btns"><div class="cap">${cfg.buttonsLabel || 'Try it'}</div></div>` : ''}
      ${cfg.stats ? '<div class="stats" id="stats"></div>' : ''}
      <div class="toast" id="toast" role="status"></div>
      <svg id="fig" role="img" aria-label="${cfg.title}"><defs id="fdefs"></defs><g id="art" filter="url(#hand)"></g></svg>
    </div>
    <div id="readout"></div>
    ${cfg.idea ? `<p class="idea"><strong>The big idea</strong>${cfg.idea}</p>` : ''}
    <div class="controls">
      <div class="ctl"><label for="wb">Hand-drawn wobble</label><input id="wb" type="range" min="0" max="7" step="0.1" value="2.4"></div>
      <div class="ctl"><label>Colour</label><div class="row" id="pals"></div></div>
      <div class="ctl" id="lblctl" hidden><label>Labels</label><div class="row"><button id="lbl" aria-pressed="true">On</button></div></div>
    </div>
    ${cfg.credit === false ? '' : '<footer class="made-with"><a href="https://april-zhu.com/colorfigures" target="_blank" rel="noopener">Made with Colorfigures ↗</a></footer>'}`;
  const st = cfg.state || {};            // kept as the same object, so a figure may hold on to it
  if (!st.pal) st.pal = cfg.palette || 'mustard';
  if (st.az == null) st.az = 105;
  const q = new URLSearchParams(location.search);
  if (PALS[q.get('pal')]) st.pal = q.get('pal');
  if (cfg.params) cfg.params(st, q);

  // frame on the object itself: centred, filling ~60% of the width / ~78% of the height of a 4:3 view.
  // The cast shadow is allowed to spill outside the frame (svg overflow is visible).
  const [W,D,H] = cfg.size, pts = [];
  OX = OY = 0; RC = cfg.center || [W/2, D/2];
  VIEW = 0;
  for (const x of [0,W]) for (const y of [0,D]) for (const z of [0,H]) pts.push(P(x,y,z));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const bw = Math.max(...xs)-Math.min(...xs), bh = Math.max(...ys)-Math.min(...ys);
  // the object fills ~74% of the width / ~88% of the height, nudged right of centre so the buttons (top left) stay clear
  const vbW = Math.max(bw/.74, bh/.88/.75), vbH = vbW*.75;
  OX = (vbW-bw)/2 + vbW*.06 - Math.min(...xs); OY = vbH*.04 - Math.min(...ys);   // sit a little high: shadows fall downward
  const svg = document.getElementById('fig');
  svg.setAttribute('viewBox', `0 0 ${f(vbW)} ${f(vbH)}`);
  INK_K = vbW / INK_REF_VB;
  document.getElementById('fdefs').innerHTML = filterFor(INK_K);

  const art = document.getElementById('art'), readout = document.getElementById('readout');
  const ui = { st };
  ui.render = () => { _clipN = 0; document.documentElement.style.setProperty('--accent', PALS[st.pal].l); art.innerHTML = inkScale(cfg.scene(st, PALS[st.pal])); if (!ui._flash) readout.textContent = cfg.readout ? cfg.readout(st) : ''; if (ui.drawStats) ui.drawStats(); };
  // big numbers in the top-right corner (credit, change, score…); a value that changes gets a little bump
  const statsEl = document.getElementById('stats'), prevStats = {};
  ui.drawStats = () => { if (!statsEl) return;
    const list = cfg.stats(st).filter(Boolean), html = list.map(x => `<div class="stat${x.small ? ' small' : ''}"><div class="k">${x.label}</div><div class="v" data-k="${x.label}">${x.value}</div></div>`).join('');
    if (statsEl._html !== html){ statsEl._html = html; statsEl.innerHTML = html;
      statsEl.querySelectorAll('.v').forEach(v => { if (prevStats[v.dataset.k] != null && prevStats[v.dataset.k] !== v.textContent) v.classList.add('bump'); prevStats[v.dataset.k] = v.textContent; }); } };
  let flashT = 0;
  const toast = document.getElementById('toast');
  ui.flash = (text, ms=1600) => { ui._flash = true; readout.textContent = text; toast.textContent = text;
    toast.style.top = ((document.getElementById('btns') ? document.getElementById('btns').offsetTop + document.getElementById('btns').offsetHeight : 0) + 8) + 'px'; toast.classList.add('show');
    clearTimeout(flashT); flashT = setTimeout(() => { ui._flash = false; toast.classList.remove('show'); ui.render(); }, ms); };
  // animations run on a ~60 fps timer rather than requestAnimationFrame, so they also run in headless test shots
  ui.animate = step => { let last = performance.now();
    const loop = () => { const now = performance.now(), dt = Math.max(0, Math.min(.05,(now-last)/1000)); last = now; const more = step(dt) !== false; ui.render(); if (more) setTimeout(loop, 16); };
    setTimeout(loop, 16); };

  // clickable parts react on press, not on click: while something animates, the scene is redrawn every frame, so the
  // element under the pointer is replaced between press and release and a 'click' would never fire
  svg.addEventListener('pointerdown', e => { if (e.button) return; const a = e.target.closest('[data-act]'); if (!a || !cfg.acts || !cfg.acts[a.dataset.act]) return;
    e.preventDefault(); cfg.acts[a.dataset.act](st, a, ui); ui.render(); });
  const btns = document.getElementById('btns');
  const stepEls = [];
  if (btns) cfg.buttons.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act';
    el.innerHTML = `${b.label}${b.choices ? '<span class="car">▾</span>' : ''}`;
    wrap.appendChild(el); btns.appendChild(wrap); stepEls.push(el);
    if (!b.choices){ el.onclick = () => { closeChips(); b.onClick(st, ui); ui.render(); }; return; }
    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;
        if (c.current) ch.setAttribute('aria-pressed', 'true');
        ch.onclick = ev => { ev.stopPropagation(); closeChips();
          if (c.current) return c.onCurrent ? c.onCurrent(st, ui) : ui.flash(`${c.label} — already set`);
          if (c.disabled) return ui.flash(c.why || `${c.label} isn't possible right now`);
          c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  // labels: the switch appears when the figure draws any tag(); ?labels=0 starts with them hidden
  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

<script>
/* AR3 kinematics from ongdexter/ar3_core, cd43fed1 (MIT, Dexter Ong).
   Uses the Xacro loaded by planning_context.launch, not the obsolete standalone URDF.
   Joint values are radians; translations are metres in base_link. */
const AR3Model = (() => {
  const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
  const add=(a,b)=>a.map((v,i)=>v+b[i]), scale=(a,k)=>a.map(v=>v*k);
  const mv=(r,v)=>r.map(row=>row.reduce((s,x,i)=>s+x*v[i],0));
  const mm=(a,b)=>a.map(row=>b[0].map((_,j)=>row.reduce((s,x,k)=>s+x*b[k][j],0)));
  const identity=()=>[[1,0,0],[0,1,0],[0,0,1]];
  function rot(axis,angle){
    const c=Math.cos(angle),s=Math.sin(angle);
    return axis==='x'?[[1,0,0],[0,c,-s],[0,s,c]]:axis==='y'?[[c,0,s],[0,1,0],[-s,0,c]]:[[c,-s,0],[s,c,0],[0,0,1]];
  }
  const rpy=([r,p,y])=>mm(mm(rot('z',y),rot('y',p)),rot('x',r));
  const at=(p,r,v)=>add(p,mv(r,v));
  const joints=[
    {xyz:[0,0,.003445],rpy:[Math.PI,0,0],axis:'z',sign:1,limits:[-2.96706,2.96706]},
    {xyz:[0,.064146,-.16608],rpy:[1.5708,.5236,-1.5708],axis:'z',sign:-1,limits:[rad(-39.6),Math.PI/2]},
    {xyz:[.1525,-.26414,0],rpy:[0,0,-1.04720367321],axis:'z',sign:-1,limits:[.0174533,2.5080381]},
    {xyz:[0,0,.00675],rpy:[1.5708,-1.2554,-1.5708],axis:'z',sign:-1,limits:[-2.8710666,2.8710666]},
    {xyz:[0,0,-.22225],rpy:[Math.PI,0,-2.8262],axis:'x',sign:1,limits:[-1.81776042,1.81776042]},
    {xyz:[-.000294,0,.02117],rpy:[0,0,3.1416],axis:'z',sign:1,limits:[-2.5848326,2.5848326]}
  ];
  const ranges=joints.map(j=>j.limits);
  const home=[90,45,90,0,-45,0].map(rad);
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  const within=q=>q.length===6&&q.every((v,i)=>Number.isFinite(v)&&v>=ranges[i][0]-1e-9&&v<=ranges[i][1]+1e-9);
  function pose(q){
    if(!Array.isArray(q)||q.length!==6||!q.every(Number.isFinite))throw new Error('Six finite joint angles required');
    let p=[0,0,0],r=identity();const points=[],axes=[],frames=[];
    joints.forEach((j,i)=>{
      p=at(p,r,j.xyz);r=mm(r,rpy(j.rpy));
      const axis=j.axis==='x'?[j.sign,0,0]:[0,0,j.sign];
      points.push(p);axes.push(mv(r,axis));r=mm(r,rot(j.axis,j.sign*q[i]));frames.push(r);
    });
    return {points,axes,frames,tool:p,rotation:r};
  }
  function frame(pose,index){
    if(!Number.isInteger(index)||index<0||index>6)throw new Error('Frame index must be 0–6');
    return index===0?{origin:[0,0,0],rotation:identity()}:{origin:pose.points[index-1],rotation:pose.frames[index-1]};
  }
  function inFrame(point,reference){
    const delta=point.map((v,i)=>v-reference.origin[i]);
    return reference.rotation[0].map((_,i)=>reference.rotation.reduce((sum,row,j)=>sum+row[i]*delta[j],0));
  }
  const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  function solve3(a,b){
    const t=a.map((row,i)=>[...row,b[i]]);
    for(let k=0;k<3;k++){
      let pivot=k;for(let i=k+1;i<3;i++)if(Math.abs(t[i][k])>Math.abs(t[pivot][k]))pivot=i;
      [t[k],t[pivot]]=[t[pivot],t[k]];
      if(Math.abs(t[k][k])<1e-12)return null;
      const d=t[k][k];for(let j=k;j<4;j++)t[k][j]/=d;
      for(let i=0;i<3;i++)if(i!==k){const f=t[i][k];for(let j=k;j<4;j++)t[i][j]-=f*t[k][j];}
    }
    return t.map(row=>row[3]);
  }
  // Position-only IK: adjust J1–J3, preserve the J4–J6 angles, with no collision checking.
  function inverse(target,seed){
    if(!Array.isArray(target)||target.length!==3||!target.every(Number.isFinite)||!within(seed))return null;
    let q=[...seed];
    for(let n=0;n<240;n++){
      const p=pose(q).tool,error=target.map((v,i)=>v-p[i]);
      if(Math.hypot(...error)<.00015)return q;
      const jac=[0,1,2].map(i=>{const v=[...q];v[i]+=.00001;return pose(v).tool.map((x,k)=>(x-p[k])/.00001);});
      const matrix=jac.map((c,i)=>jac.map((d,j)=>c.reduce((sum,v,k)=>sum+v*d[k],0)+(i===j?.0002:0)));
      const rhs=jac.map(c=>c.reduce((sum,v,k)=>sum+v*error[k],0));
      const delta=solve3(matrix,rhs);if(!delta)return null;
      for(let i=0;i<3;i++)q[i]=clamp(q[i]+clamp(delta[i],-.12,.12),...ranges[i]);
    }
    return null;
  }
  return {rad,deg,add,scale,mv,mm,rot,rpy,at,identity,joints,ranges,home,clamp,within,pose,frame,inFrame,lerp,inverse};
})();

</script>
<script>
/* Legacy Annin AR3/ARCS Teensy 3.5 protocol (115200 baud).
   Reference: kentavv/annin_robotics_ar3, e1485f08, ARCS_teensy_sketch.ino.
   No LM/LL commands: reference calibration never changes firmware encoder counts. */
const AR3Serial = (() => {
  // GP/MJ normally snap encoders to the supplied targets on success. Deliberately
  // unreachable targets preserve raw feedback; their mismatch flags are expected.
  const sentinel='U-1000000V-1000000W-1000000X-1000000Y-1000000Z-1000000';
  function parse(line){
    const match=/^01[01]{6}A(-?\d+)B(-?\d+)C(-?\d+)D(-?\d+)E(-?\d+)F(-?\d+)$/.exec(line.trim());
    if(!match)throw new Error('protocol');
    const raw=match.slice(1).map(Number);
    if(raw.some(v=>!Number.isSafeInteger(v)||Math.abs(v)>20000))throw new Error('protocol');
    return raw;
  }
  function validateScale(scale){
    if(scale.length!==6||scale.some(v=>!Number.isFinite(v)||Math.abs(v)<1||Math.abs(v)>200))throw new Error('settings');
  }
  function angles(raw,cal){
    return raw.map((v,i)=>cal.q[i]+AR3Model.rad((v-cal.raw[i])/cal.scale[i]));
  }
  function plan(raw,cal,target,joint,directions){
    validateScale(cal.scale);
    const current=angles(raw,cal);
    if(!AR3Model.within(current)||!AR3Model.within(target)||!Number.isInteger(joint)||joint<0||joint>5||directions.length!==6||directions.some(v=>v!==0&&v!==1))throw new Error('settings');
    const delta=AR3Model.clamp(AR3Model.deg(target[joint]-current[joint]),-1,1);
    const steps=Math.trunc(Math.abs(delta*cal.scale[joint]));
    if(!steps)throw new Error('atTarget');
    const increase=delta*cal.scale[joint]>0,bit=increase?directions[joint]:1-directions[joint];
    const expected=[...raw];expected[joint]+=(increase?1:-1)*steps;
    const q=angles(expected,cal);
    if(!AR3Model.within(q))throw new Error('settings');
    const axes=raw.map((_,i)=>`${'ABCDEF'[i]}${i===joint?bit:0}${i===joint?steps:0}`).join('');
    return {command:`MJ${axes}T00S5G10H10I10K10${sentinel}\n`,q};
  }
  class Connection{
    constructor(serial,onChange=()=>{},onLog=()=>{}){this.serial=serial;this.onChange=onChange;this.onLog=onLog;this.port=null;this.pending=null;this.reader=null;this.buffer='';this.fault=false;}
    async connect(){
      if(this.port)throw new Error('busy');
      this.onLog('choosing');
      const port=await this.serial.requestPort();
      const info=port.getInfo?.()||{};
      this.onLog('opening',JSON.stringify(info));
      await port.open({baudRate:115200});this.port=port;this.fault=false;
      this.onLog('open','115200 baud');
      this.reader=port.readable.getReader();this.reading=this.readLoop();
      try{return await this.query();}catch(error){await this.close();throw error;}
    }
    async readLoop(){
      const decoder=new TextDecoder();
      try{
        while(this.port){
          const {value,done}=await this.reader.read();if(done)break;
          const chunk=decoder.decode(value,{stream:true});
          this.onLog('rx',chunk);this.buffer+=chunk;
          if(this.buffer.length>4096)throw new Error('protocol');
          let end;
          while((end=this.buffer.indexOf('\n'))>=0){
            const line=this.buffer.slice(0,end).trim();this.buffer=this.buffer.slice(end+1);
            if(!line)continue;
            if(!this.pending)throw new Error('protocol');
            const raw=parse(line),pending=this.pending;this.pending=null;clearTimeout(pending.timer);
            this.onLog('verified',raw.join(', '));pending.resolve(raw);
          }
        }
      }catch(error){this.fail(error);}
      finally{if(this.port&&!this.fault)this.fail(new Error('disconnected'));}
    }
    fail(error){
      this.fault=true;
      this.onLog('error',`${error.name}: ${error.message}`);
      if(this.pending){clearTimeout(this.pending.timer);this.pending.reject(error);this.pending=null;}
      this.onChange(error);
    }
    async request(command){
      if(!this.port||this.fault)throw new Error('disconnected');
      if(this.pending)throw new Error('busy');
      const result=new Promise((resolve,reject)=>{this.pending={resolve,reject,timer:setTimeout(()=>this.fail(new Error('timeout')),8000)};});
      result.catch(()=>{}); // A read failure can arrive while write() is still pending.
      let writer;
      try{writer=this.port.writable.getWriter();this.onLog('tx',command);await writer.write(new TextEncoder().encode(command));}catch(error){this.fail(error);}finally{writer?.releaseLock();}
      return result;
    }
    query(){return this.request(`GP${sentinel}\n`);}
    async close(){
      const port=this.port;this.port=null;
      if(!port)return;
      if(this.pending)this.fail(new Error('disconnected'));
      try{await this.reader.cancel();await this.reading;}finally{this.reader.releaseLock();await port.close();this.reader=null;this.buffer='';this.onLog('closed');}
    }
  }
  return {parse,validateScale,angles,plan,Connection};
})();

let robotLanguage='en';
try{const saved=localStorage.getItem('ar3-language');if(Object.hasOwn(robotTranslations,saved))robotLanguage=saved;}catch{}
function robotT(key,values={}){
  const copy=robotTranslations[robotLanguage];
  const params={...values};
  if(params.joint){params.jointName=copy.jointNames[params.joint-1];params.jointExplain=copy.jointExplanations[params.joint-1];}
  return copy[key].replace(/\{(\w+)\}/g,(_,name)=>params[name]);
}

    check:'03 · 확인 질문',answer:'설명 보기',done:'자료와 확인 질문을 학습했어요',previous:'← 이전',next:'다음 →',finished:'모든 단계를 확인했습니다. 원하는 단계를 다시 살펴보세요.',
    lessons:[
      {title:'시동과 보정',reading:'공식 1번 영상에서 소프트웨어 설치, 센서 확인, 축별 조그, 보정 순서를 봅니다. 먼저 전체 흐름을 읽고, 조그 설명에서 잠시 멈춰 옆의 모델을 움직여보세요.',
       steps:['실습 준비를 누른 뒤 J1에 +10°를 한 번 입력하세요.','명령 배열의 첫 번째 값과 팔 전체의 움직임을 비교하세요.','J2와 J3도 하나씩 선택해 +10°를 주고, 함께 움직이는 Link (링크)를 찾으세요.'],
       question:'기준 자세로 돌아오는 것과 영점을 보정하는 것은 어떻게 다를까요?',answer:'기준 자세는 이미 정해진 관절 각도로 이동하는 것입니다. 보정은 센서와 기구의 기준을 이용해 실제 위치와 Controller (제어기) 값의 관계를 맞춥니다. 이 화면의 기준 자세 버튼은 보정하지 않습니다.',limit:'센서 검사·펌웨어 설치·자동 보정은 원본 자료로 학습합니다. 여기서는 축별 움직임만 관찰합니다.'},
      {title:'HMI 기본 프로그래밍',reading:'공식 2번 영상에서 HMI 구성, 가상 로봇, 조그 방식과 프로그램 작성 흐름을 봅니다. 관절 조그와 좌표 조그가 어떤 요청인지 비교하는 것이 이번 실습의 목표입니다.',
       steps:['실습 준비 후 Z +20 mm를 누르고 J1~J3의 변화를 보세요.','관절 명령 탭에서 J2를 선택하고 +10°를 누르세요.','두 경우의 목표 단위와 끝단 좌표 변화를 비교하세요.'],
       question:'Z를 20 mm 바꾸라는 명령이 왜 여러 관절을 움직일까요?',answer:'Z는 끝단 위치의 목표입니다. 그 위치를 만들 관절 조합을 역기구학으로 계산하기 때문에 여러 각도가 함께 바뀔 수 있습니다.',limit:'HMI 프로그램 실행과 Tool Frame 조그는 이 모델에 없습니다. 좌표 조그는 base_link 기준의 Flange (플랜지) 위치만 맞춥니다.'},
      {title:'고급 이동과 특이점',reading:'공식 3번 영상에서 원호·원·스플라인 경로와 Wrist (손목) 구성을 봅니다. 여기서는 도착점과 이동 경로가 서로 다른 조건이라는 점을 관찰합니다.',
       steps:['실습 준비 후 X +20 mm를 누르세요.','움직이는 동안 끝단을 보고, 도착 좌표도 확인하세요.','같은 도착점이라도 직선·원호처럼 경로 조건을 따로 지정해야 하는 이유를 설명하세요.'],

      {title:'비전으로 물체 집기',reading:'공식 4번 영상에서 카메라 보정, 물체 등록, 검출 위치를 이용한 이동 흐름을 봅니다. 이 실습은 검출 이후의 좌표 오프셋 개념을 다룹니다.',
       steps:['실습 준비 후 X +20 mm, Y +20 mm를 차례로 누르세요.','각 이동이 끝난 뒤 좌표 변화량을 기록하세요.','관절 명령 탭에서 Gripper (집게)를 열고 닫아 팔의 이동과 구분하세요.'],
       question:'카메라의 픽셀 좌표를 그대로 로봇의 mm 좌표로 쓸 수 있을까요?',answer:'그대로 쓸 수 없습니다. 카메라 보정과 좌표 변환을 통해 로봇이 사용하는 기준 좌표로 연결해야 합니다. 여기서 입력한 20 mm는 이미 로봇 기준의 거리입니다.',limit:'카메라·인식·물체·파지 성공 판정은 없습니다. Gripper (집게)는 시각적 개폐만 보여줍니다.'},
      {title:'프로그래밍 종합 복습',reading:'공식 5번 종합 영상에서 위치 티칭, 이동, 분기와 I/O를 연결해 봅니다. 필요한 부분을 다시 보며 팔의 동작과 Gripper (집게) 명령을 구분해 정리하세요.',
       steps:['실습 준비 후 J6에 +10°를 입력하세요.','Gripper (집게)를 닫고, J1~J6 명령 배열이 그대로인지 확인하세요.','J1을 +10° 움직인 뒤 Gripper (집게)를 열며 동작 순서를 말로 설명하세요.'],
       question:'Gripper (집게)를 닫는 명령은 여섯 번째 관절 각도일까요?',answer:'아닙니다. J6는 Tool (도구)의 회전이고 Gripper (집게) 개폐는 별도 구동입니다. 프로그램에서는 팔 이동과 Gripper (집게) I/O를 서로 다른 동작으로 다룹니다.',limit:'수동으로 동작 순서를 관찰합니다. 프로그램 저장·반복·I/O·Modbus는 공식 소프트웨어에서 다룹니다.'},
      {title:'ROS 2 설치와 제어',reading:'공식 6번 영상에서 노드, MoveIt, Controller (제어기)와 Hardware interface (하드웨어 인터페이스)의 역할을 봅니다. 먼저 명령이 어떤 경로로 Motor (모터)에 전달되는지 연결해 보세요.',
       steps:['실습 준비를 눌러 Control cabinet (제어함)과 명령 흐름을 펼치세요.','J2에 +10°를 주고 joint_2의 목표값을 확인하세요.','PC의 목표에서 Controller (제어기)와 Motor (모터)까지 전달되는 과정을 따라가세요.'],
       question:'화면의 positions 값은 Motor (모터)에 보내는 펄스 수일까요?',answer:'아닙니다. positions는 관절 목표 각도(rad)입니다. 실제 드라이버는 기종의 보정값과 통신 규약에 맞게 이를 변환합니다.',limit:'이 그림은 AR3의 ROS 모델·Teensy 3.5 흐름입니다. AR4 ROS 2·Teensy 4.1 실행 환경이나 실제 통신을 재현하지 않습니다.'},
      {title:'로봇 기구학',reading:'공식 7번 영상에서 회전행렬, 좌표 변환, FK와 IK를 학습합니다. 수식의 입력과 출력이 옆의 관절 각도·끝단 좌표에 어떻게 대응하는지 확인하세요.',
       steps:['실습 준비 후 J6에 +10°를 주고 Flange (플랜지) XYZ가 유지되는지 보세요.','J2를 선택해 +10°를 주며 각도에서 좌표가 계산되는 FK를 확인하세요.','끝단 위치 탭에서 Z +20 mm를 눌러 좌표에서 각도를 구하는 IK와 비교하세요.'],
       question:'J6를 돌렸는데 XYZ가 같다면 로봇의 자세도 같을까요?',answer:'위치가 같아도 방향은 달라질 수 있습니다. 여기서 XYZ는 Flange (플랜지) 원점이며, J6 회전은 그 원점의 위치를 유지하면서 Tool (도구)의 방향을 바꿉니다.',limit:'이 IK는 J1~J3으로 위치만 계산합니다. 6축 위치·방향 해, 다중 해와 충돌 검사는 포함하지 않습니다.'}
    ]
  },
  en:{
    heading:'Study alongside the official tutorials',order:'Annin Robotics website order',choose:'Choose a tutorial',

    progress:'Steps you have reviewed',saved:'Progress is saved in this browser.',unsaved:'Progress cannot be saved. It lasts for this tab only.',

    check:'03 · Check your understanding',answer:'Show explanation',done:'I reviewed the material and question',previous:'← Previous',next:'Next →',finished:'You have reviewed every step. Revisit any tutorial.',
    lessons:[
      {title:'Startup and calibration',reading:'In official tutorial 1, follow software setup, sensor checks, axis jogging and calibration. Watch the overview, then pause at jogging to explore the model.',steps:['Prepare practice, then press +10° for J1.','Compare the first command entry with the movement of the whole arm.','Select J2 and J3 in turn, add +10°, and find the links that follow.'],question:'How does returning to a ready pose differ from calibration?',answer:'A ready pose specifies known joint angles. Calibration establishes the relationship between physical references and controller values. The ready button here does not calibrate anything.',limit:'Use the source for sensor checks, firmware and auto-calibration. This exercise shows joint motion only.'},
      {title:'HMI programming basics',reading:'In official tutorial 2, explore the HMI, virtual robot, jogging modes and programming workflow. Compare requests made in joint space and Cartesian space.',steps:['Prepare practice, press Z +20 mm and watch J1–J3.','Open Joint commands, select J2 and press +10°.','Compare the target units and the resulting flange coordinates.'],question:'Why can a 20 mm Z request move several joints?',answer:'Z specifies an end-position target. Inverse kinematics finds joint angles that achieve it, so several angles may change together.',limit:'HMI program execution and Tool Frame jogging are not included. Cartesian jogging targets the flange position in base_link.'},
      {title:'Advanced motion and singularities',reading:'Official tutorial 3 covers arcs, circles, splines and wrist configurations. Use this exercise to distinguish an endpoint from the path taken to reach it.',steps:['Prepare practice, then press X +20 mm.','Observe the moving end and its final coordinates.','Explain why a straight or curved path requires a separate path constraint.'],question:'Does reaching the target prove that the motion was a straight line?',answer:'No. This model interpolates joint angles between two configurations. Reaching the endpoint does not guarantee a straight path or particular intermediate poses.',limit:'Arc, circle and spline execution and singularity detection are not implemented. Study those in the video and official HMI virtual robot.'},
      {title:'Vision-guided picking',reading:'Official tutorial 4 covers camera calibration, object teaching and motion from detections. Here, explore coordinate offsets after detection.',steps:['Prepare practice, then press X +20 mm followed by Y +20 mm.','Record the coordinate changes after each move finishes.','Open Joint commands and open/close the gripper separately from arm motion.'],question:'Can camera pixels be used directly as robot millimetres?',answer:'No. Camera calibration and coordinate transforms relate detections to the robot frame. The 20 mm entered here is already a distance in that frame.',limit:'There is no camera, recognition, object or grasp-success check. The gripper only illustrates opening and closing.'},
      {title:'Programming review',reading:'Use official tutorial 5 to connect taught positions, motion, branching and I/O. Revisit the relevant parts and separate arm commands from gripper actions.',steps:['Prepare practice and add +10° to J6.','Close the gripper and check that the J1–J6 command vector stays unchanged.','Move J1 by +10°, then open the gripper and describe the sequence.'],question:'Is closing the gripper the sixth joint angle?',answer:'No. J6 rotates the tool; opening and closing the gripper uses a separate actuator. A program treats arm motion and gripper I/O as separate actions.',limit:'This is a manual sequence. Program storage, loops, I/O and Modbus belong in the official software.'},
      {title:'ROS 2 setup and control',reading:'Official tutorial 6 introduces nodes, MoveIt, controllers and the hardware interface. Trace how a target reaches the motors before installing anything.',steps:['Prepare practice to open the cabinet and control-flow view.','Add +10° to J2 and inspect the joint_2 target.','Trace the request from the PC through the controller to the motor.'],question:'Are the displayed positions values motor pulse counts?',answer:'No. They are target joint angles in radians. The real driver converts them using the robot’s calibration and communication protocol.',limit:'This diagram uses the AR3 ROS model and Teensy 3.5. It does not run the AR4 ROS 2 / Teensy 4.1 stack or communicate with hardware.'},
      {title:'Robot kinematics',reading:'Official tutorial 7 develops rotation matrices, transforms, FK and IK. Relate their inputs and outputs to the joint angles and end coordinates beside you.',steps:['Prepare practice, add +10° to J6 and check that flange XYZ stays fixed.','Select J2 and add +10° to observe FK: angles to coordinates.','Open End position and press Z +20 mm to compare IK: coordinates to angles.'],question:'If J6 changes while XYZ stays fixed, is the pose unchanged?',answer:'Position may stay fixed while orientation changes. XYZ here refers to the flange origin; J6 rotates the tool without translating that origin.',limit:'This IK solves position with J1–J3 only. Full six-axis pose solutions, multiple solutions and collision checks are not included.'}
    ]

  es:{
    heading:'Estudia con los tutoriales oficiales',order:'Orden de la web de Annin Robotics',choose:'Elige un tutorial',
    note:'Las fuentes explican el AR4; el modelo es un AR3. Observa los conceptos de control que comparten.',
    progress:'Pasos que has revisado',saved:'El progreso se guarda en este navegador.',unsaved:'No se puede guardar el progreso. Solo durará en esta pestaña.',

    check:'03 · Comprueba lo aprendido',answer:'Ver explicación',done:'He revisado el material y la pregunta',previous:'← Anterior',next:'Siguiente →',finished:'Has revisado todos los pasos. Puedes volver a cualquier tutorial.',
    lessons:[
      {title:'Puesta en marcha y calibración',reading:'En el tutorial oficial 1, sigue la instalación, las comprobaciones de sensores, el jogging y la calibración. Pausa en el jogging para explorar el modelo.',steps:['Prepara la práctica y pulsa +10° para J1.','Compara la primera entrada del comando con el movimiento del brazo.','Selecciona J2 y J3 por turnos, suma +10° y observa qué Links (eslabones) las siguen.'],question:'¿En qué se diferencia volver a una postura de referencia de calibrar?',answer:'La postura especifica ángulos conocidos. Calibrar establece la relación entre referencias físicas y valores del Controller (controlador). Este botón no calibra el robot.',limit:'Consulta la fuente para sensores, firmware y calibración automática. Aquí solo observamos movimiento articular.'},
      {title:'Programación básica del HMI',reading:'El tutorial oficial 2 explica el HMI, el robot virtual, el jogging y la programación. Compara peticiones en espacio articular y cartesiano.',steps:['Prepara la práctica, pulsa Z +20 mm y observa J1–J3.','Abre Comandos articulares, selecciona J2 y pulsa +10°.','Compara las unidades del objetivo y las coordenadas resultantes.'],question:'¿Por qué una petición de 20 mm en Z puede mover varias articulaciones?',answer:'Z indica una posición final. La cinemática inversa calcula los ángulos para alcanzarla; varios pueden cambiar a la vez.',limit:'No se ejecutan programas HMI ni jogging en Tool Frame. El jogging cartesiano fija la posición de la Flange (brida) respecto a base_link.'},
      {title:'Movimientos avanzados y singularidades',reading:'El tutorial oficial 3 explica arcos, círculos, splines y configuraciones de Wrist (muñeca). Distingue el destino de la trayectoria para alcanzarlo.',steps:['Prepara la práctica y pulsa X +20 mm.','Observa el extremo durante el movimiento y sus coordenadas finales.','Explica por qué una trayectoria recta o curva necesita una condición adicional.'],question:'¿Llegar al objetivo demuestra que se siguió una línea recta?',answer:'No. Este modelo interpola ángulos articulares. Llegar al destino no garantiza una trayectoria recta ni posturas intermedias concretas.',limit:'No hay arcos, círculos, splines ni detección de singularidades. Estúdialos en el vídeo y el robot virtual del HMI oficial.'},
      {title:'Recogida guiada por visión',reading:'El tutorial oficial 4 explica calibración de cámara, registro de objetos y movimiento desde detecciones. Aquí exploramos desplazamientos tras la detección.',steps:['Prepara la práctica y pulsa X +20 mm y después Y +20 mm.','Anota los cambios de coordenadas al terminar cada movimiento.','Abre Comandos articulares y abre/cierra la Gripper (pinza) por separado.'],question:'¿Se pueden usar píxeles de cámara directamente como milímetros del robot?',answer:'No. La calibración y las transformaciones relacionan las detecciones con el sistema del robot. Los 20 mm introducidos aquí ya están en ese sistema.',limit:'No hay cámara, reconocimiento, objetos ni comprobación de agarre. La Gripper (pinza) solo ilustra apertura y cierre.'},

let robotCourseSaved=true;
function robotCourseLoad(){
  const state={current:robotCourseLessons[0].id,completed:[]};
  try{
    const saved=JSON.parse(localStorage.getItem('ar3-course-v1'));
    if(saved&&robotCourseLessons.some(l=>l.id===saved.current))state.current=saved.current;
    if(Array.isArray(saved?.completed))state.completed=robotCourseLessons.filter(l=>saved.completed.includes(l.id)).map(l=>l.id);
  }catch{robotCourseSaved=false;}
  return state;
}
const robotCourseState=robotCourseLoad();
function robotCourseSave(){
  try{localStorage.setItem('ar3-course-v1',JSON.stringify(robotCourseState));robotCourseSaved=true;}catch{robotCourseSaved=false;}
}
function robotCourseSelect(id){
  if(!robotCourseLessons.some(l=>l.id===id))return;
  robotCourseState.current=id;robotCourseSave();robotCourseRender();
}
function robotCourseMount(panel){
  const course=document.createElement('section');course.className='course-bar';course.setAttribute('aria-labelledby','course-heading');
  course.innerHTML='<div><h2 id="course-heading"></h2><a id="course-source" href="https://anninrobotics.com/tutorials" target="_blank" rel="noopener"></a><p id="course-note"></p></div><div class="course-choice"><label for="course-select" id="course-select-label"></label><select id="course-select"></select><div id="course-progress" role="status"></div></div>';
  document.querySelector('header').after(course);
  const controls=document.createElement('details');controls.id='practice-controls';controls.open=true;
  const summary=document.createElement('summary');summary.id='practice-controls-label';controls.append(summary);
  controls.append(...panel.children);
  const study=document.createElement('section');study.id='course-study';study.setAttribute('aria-labelledby','course-title');
  const navigation=document.createElement('div');navigation.className='course-navigation';
  navigation.innerHTML='<label class="course-completion"><input type="checkbox" id="course-complete"><span id="course-complete-label"></span></label><div class="course-paging"><button id="course-previous"></button><button id="course-next"></button></div><p id="course-storage"></p><p id="course-finished" role="status"></p>';
  panel.append(study,navigation,controls);
  document.getElementById('course-select').onchange=e=>robotCourseSelect(e.target.value);
  document.getElementById('course-complete').onchange=e=>{
    const id=robotCourseState.current;
    robotCourseState.completed=robotCourseState.completed.filter(value=>value!==id);
    if(e.target.checked)robotCourseState.completed.push(id);
    robotCourseSave();robotCourseRender();
  };
  for(const [id,delta] of [['previous',-1],['next',1]])document.getElementById(`course-${id}`).onclick=()=>{
    const next=robotCourseLessons.findIndex(l=>l.id===robotCourseState.current)+delta;
    if(robotCourseLessons[next])robotCourseSelect(robotCourseLessons[next].id);
  };
  study.addEventListener('click',e=>{
    if(!e.target.closest('#course-prepare'))return;
    const current=robotCourseLessons.find(l=>l.id===robotCourseState.current);
    controls.open=true;
    robotReset();robotUI.st.inside=current.lesson==='flow';robotLesson(current.lesson);robotSelect(current.joint);

    document.querySelector('.actions .act').focus({preventScroll:true});
  });

function robotCourseRender(){
  const copy=robotCourseCopy[robotLanguage],index=robotCourseLessons.findIndex(l=>l.id===robotCourseState.current),lesson=robotCourseLessons[index],text=copy.lessons[index];
  for(const [id,key] of [['course-heading','heading'],['course-source','order'],['course-note','note'],['course-select-label','choose'],['course-complete-label','done'],['course-previous','previous'],['course-next','next']])document.getElementById(id).textContent=copy[key];
  document.getElementById('practice-controls-label').innerHTML=`${copy.controls}<span class="control-collapse">${copy.collapse} −</span><span class="control-expand">${copy.expand} +</span>`;
  const select=document.getElementById('course-select');
  select.replaceChildren(...robotCourseLessons.map((item,i)=>{
    const option=document.createElement('option');option.value=item.id;option.textContent=`${String(i+1).padStart(2,'0')} · ${copy.lessons[i].title}${robotCourseState.completed.includes(item.id)?' ✓':''}`;return option;
  }));select.value=lesson.id;
  document.getElementById('course-progress').textContent=`${copy.progress} · ${robotCourseState.completed.length} / ${robotCourseLessons.length}`;
  document.getElementById('course-study').innerHTML=`<div class="axis">TUTORIAL ${String(index+1).padStart(2,'0')} / 07 · AR4</div><h2 id="course-title">${text.title}</h2><h3>${copy.read}</h3><p>${text.reading}</p><div class="course-links"><a href="https://www.youtube.com/watch?v=${lesson.video}" target="_blank" rel="noopener">${copy.watch}</a>${lesson.start?`<a href="https://www.youtube.com/watch?v=${lesson.video}&t=${lesson.start}s" target="_blank" rel="noopener">${copy.segment}</a>`:''}</div><h3>${copy.practice}</h3><ol>${text.steps.map(step=>`<li>${step}</li>`).join('')}</ol><button id="course-prepare">${copy.prepare}</button><p class="course-limit">${text.limit}</p><h3>${copy.check}</h3><p>${text.question}</p><details><summary>${copy.answer}</summary><p>${text.answer}</p></details>`;
  document.getElementById('course-complete').checked=robotCourseState.completed.includes(lesson.id);
  document.getElementById('course-previous').disabled=index===0;
  document.getElementById('course-next').disabled=index===robotCourseLessons.length-1;
  document.getElementById('course-storage').textContent=copy[robotCourseSaved?'saved':'unsaved'];
  document.getElementById('course-finished').textContent=robotCourseState.completed.length===robotCourseLessons.length?copy.finished:'';
}

<script>
const robotMetal={l:'#e5e7e3',m:'#b9c2c1',d:'#747e81'};
const robotRubber={l:'#535957',m:'#343b3b',d:'#262c2c'};
const robotBoard={l:'#e6dfd0',m:'#d3c5b0',d:'#a8987d'};
const robotMint={l:'#97c7aa',m:'#75a78d',d:'#416651'};
function robotBox(p,r,a,b,m){
  const v=(x,y,z)=>AR3Model.at(p,r,[x,y,z]);
  const [x,y,z]=a,[X,Y,Z]=b;
  const faces=[
    [[1,0,0],[v(X,y,z),v(X,Y,z),v(X,Y,Z),v(X,y,Z)]],
    [[-1,0,0],[v(x,y,z),v(x,Y,z),v(x,Y,Z),v(x,y,Z)]],
    [[0,1,0],[v(x,Y,z),v(X,Y,z),v(X,Y,Z),v(x,Y,Z)]],
    [[0,-1,0],[v(x,y,z),v(X,y,z),v(X,y,Z),v(x,y,Z)]],
    [[0,0,1],[v(x,y,Z),v(X,y,Z),v(X,Y,Z),v(x,Y,Z)]],
    [[0,0,-1],[v(x,y,z),v(X,y,z),v(X,Y,z),v(x,Y,z)]]
  ];
  return faces.filter(([n])=>vis(AR3Model.mv(r,n))).map(([n,pts])=>shape(pts,tone(AR3Model.mv(r,n),m),.8)).join('')+
    hullInk([v(x,y,z),v(X,y,z),v(x,Y,z),v(X,Y,z),v(x,y,Z),v(X,y,Z),v(x,Y,Z),v(X,Y,Z)],2);
}
function robotJoint(p,axis,radius,m,index,st){
  const start=AR3Model.add(p,AR3Model.scale(axis,-3.5)),end=AR3Model.add(p,AR3Model.scale(axis,3.5));
  const visible=dot(axis,[1,1,1])>=0?end:start;
  const offset=dot(axis,[1,1,1])>=0?.4:-.4;
  const cap=AR3Model.add(visible,AR3Model.scale(axis,offset));
  let out=rod(start,end,radius,m,tone,1.5);
  out+=rod(visible,cap,radius*.68,robotMetal,toneI,1.1);
  out+=rod(cap,AR3Model.add(cap,AR3Model.scale(axis,offset*.5)),radius*.20,robotRubber,toneI,.7);
  return act('joint',out,`data-joint="${index}"`);
}
function robotArc(p,axis,radius){
  const u=norm(cross(axis,Math.abs(axis[2])>.9?[1,0,0]:[0,0,1])),v=cross(axis,u);
  const pts=Array.from({length:25},(_,i)=>{const a=(-35+i*270/24)*Math.PI/180;return AR3Model.add(p,AR3Model.add(AR3Model.scale(u,Math.cos(a)*radius),AR3Model.scale(v,Math.sin(a)*radius)));});
  const tip=pts.at(-1),prev=pts.at(-2),dir=norm(sub(tip,prev));
  return `<path d="${pd(pts,false)}" fill="none" stroke="#bc4e36" stroke-width="2" stroke-dasharray="4 2"/>`+
    shape([tip,AR3Model.add(tip,AR3Model.add(AR3Model.scale(dir,-3),AR3Model.scale(axis,1.4))),AR3Model.add(tip,AR3Model.add(AR3Model.scale(dir,-3),AR3Model.scale(axis,-1.4)))],'#bc4e36',0);
}
function robotCable(pts){
  const d=pd(pts,false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#737b77" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
}
const robotViewRotation=AR3Model.rot('z',Math.PI);
const robotWorld=p=>AR3Model.add([22,34,7],AR3Model.scale(AR3Model.mv(robotViewRotation,p),100));
const robotVector=v=>AR3Model.mv(robotViewRotation,v);
function robotFrame(a,b){
  const x=norm(sub(b,a)),y=norm(cross(Math.abs(x[2])>.95?[0,1,0]:[0,0,1],x)),z=cross(x,y);
  return [[x[0],y[0],z[0]],[x[1],y[1],z[1]],[x[2],y[2],z[2]]];
}
function robotScene(st,m){
  const pose=AR3Model.pose(window.robotHardware?.sample()?.q||st.q),pts=pose.points.map(robotWorld),axes=pose.axes.map(robotVector),toolFrame=AR3Model.mm(robotViewRotation,pose.rotation);
  const [base,shoulder,elbow,roll,wrist,flange]=pts,upper=robotFrame(shoulder,elbow),fore=robotFrame(roll,wrist);
  const upperLen=Math.hypot(...sub(elbow,shoulder)),foreLen=Math.hypot(...sub(wrist,roll));
  let out=board(3,4,91,79,3,3,robotBoard);
  const clip=boardTop(3,4,91,79,3,3);
  for(const [a,b,r] of [[base,shoulder,6],[shoulder,elbow,4],[roll,wrist,3]]){
    out+=castShadow([a,b].flatMap(p=>[-1,1].flatMap(x=>[-1,1].map(y=>[p[0]+x*r,p[1]+y*r,p[2]]))),3,clip);
  }
  out+=castShadow([[4,57,3],[24,74,3],[4,57,17],[24,74,17]],3,clip);
  out+=robotCable([[24,63,7],[28,58,4],[17,49,4],[18,39,8],[22,34,10]]);
  // A separate illustration of the motor drive belongs in AR3's external enclosure.
  const control=()=>{
    let s=box(4,57,3,24,74,17,robotMetal,toneI,1.4);
    if(st.inside){
      s+=shape(on(PX(24.2),rectUV(59,5,72,15)),robotRubber.m,1);
      s+=box(24.4,67,6,25.5,71,14,robotMint,toneI,.8);
      for(let i=0;i<6;i++)s+=box(24.4,59+(i%3)*2,6+Math.floor(i/3)*4.5,25.8,60.4+(i%3)*2,9.3+Math.floor(i/3)*4.5,DARK,toneI,.6);
      s+=txY(14,74.2,9,'TEENSY 3.5',2.5);
    }else{
      s+=shape(on(PX(24.2),rrUV(60,8,71,14,1)),m.l,1);
      s+=tx(24.3,65.5,10,'AR3 CTRL',2.2);
      for(let k=0;k<4;k++)s+=line([[8+k*3,74.2,6],[8+k*3,74.2,13]],.8);

  };
  const parts=[{at:[14,66,10],svg:control()},{at:[22,34,5],svg:box(11,23,3,33,45,7,robotMetal,toneI,1.3)},
    {at:[22,34,10],svg:cyl(22,34,7,12,7.5,m,tone,1.8)},
    {at:avg([base,shoulder]),svg:rod(base,shoulder,5.4,m,tone,1.7)},
    {at:avg([shoulder,elbow]),svg:robotBox(shoulder,upper,[0,-3.2,-2.4],[upperLen,3.2,2.4],robotMetal)+
      robotBox(shoulder,upper,[3,-3.8,-2],[upperLen-3,-3.2,2],m)},
    {at:avg([roll,wrist]),svg:rod(roll,wrist,2.6,robotMetal,toneI,1.5)}];
  // Pulleys and belt on the upper arm (schematic L-series transmission).
  const bp=v=>AR3Model.at(shoulder,upper,v);
  parts.push({at:bp([upperLen/2,3.6,0]),svg:ink(pd([bp([2,3.6,1.7]),bp([upperLen-2,3.6,1.7]),bp([upperLen-2,3.6,-1.7]),bp([2,3.6,-1.7])]),1.3)});
  for(let j=1;j<6;j++){
    const p=pts[j],axis=axes[j];
    if(j===1||j===2){
      const end=AR3Model.add(p,AR3Model.scale(axis,-8));
      parts.push({at:AR3Model.add(p,AR3Model.scale(axis,-5.5)),svg:rod(AR3Model.add(p,AR3Model.scale(axis,-3)),end,3,robotRubber,toneI,1.1)+rod(end,AR3Model.add(end,AR3Model.scale(axis,-1)),2.3,robotMint,toneI,.9)});
    }
    // J3 and J4 share a compact elbow assembly; a short sleeve keeps both axes readable.
    const jointPoint=j===3?AR3Model.add(p,AR3Model.scale(norm(sub(wrist,p)),4)):p;
    parts.push({at:jointPoint,svg:robotJoint(jointPoint,axis,j<3?4.6:j===3?3.5:2.7,m,j,st)});
  }
  parts.push({at:flange,svg:rod(wrist,flange,2.4,robotMetal,toneI,1.1)});
  const palm=AR3Model.at(flange,toolFrame,[0,0,4]);
  parts.push({at:palm,svg:robotBox(flange,toolFrame,[-4,-2.3,1],[4,2.3,5],robotRubber)});
  const opening=st.grip?2:4.8;
  for(const sign of [-1,1])parts.push({at:AR3Model.at(flange,toolFrame,[sign*opening,0,7]),svg:robotBox(flange,toolFrame,[sign*opening-.55,-1.2,4],[sign*opening+.55,1.2,10],robotMetal)});
  out+=byDepth(parts);
  if(st.target){
    const t=robotWorld(st.target);out+=line([flange,t],.7);
    const [x,y]=P(...t);out+=`<circle cx="${x}" cy="${y}" r="${4*INK_K}" fill="none" stroke="#bf533a" stroke-width="1.5" stroke-dasharray="2 2"/>`;
  }
  const drawFrame=(origin,rotation,dashed)=>{
    let svg='';
    for(const [i,color,label] of [[0,'#bf533a','X'],[1,'#3c8567','Y'],[2,'#5079b0','Z']]){
      const tip=robotWorld(AR3Model.at(origin,rotation,[0,0,0].map((_,j)=>j===i?.12:0))),q=P(...tip);
      svg+=`<path d="${pd([robotWorld(origin),tip],false)}" fill="none" stroke="${color}" stroke-width="2" ${dashed?'stroke-dasharray="4 3"':''}/><text x="${q[0]}" y="${q[1]-2}" fill="${color}" font-size="${10*INK_K}" font-weight="800">${label}${dashed?'*':''}</text>`;
    }

  };
  const reference=AR3Model.frame(pose,st.frame??0),goal=AR3Model.pose(st.commandQ),goalPoint=robotWorld(goal.tool),screenGoal=P(...goalPoint);
  out+=`<g class="coordinate-frames">${drawFrame(reference.origin,reference.rotation,false)}${drawFrame(goal.tool,goal.rotation,true)}<path d="${pd([flange,goalPoint],false)}" fill="none" stroke="#805193" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="${screenGoal[0]}" cy="${screenGoal[1]}" r="${4*INK_K}" fill="none" stroke="#805193" stroke-width="1.5"/></g>`;
  if(st.selected>=0&&st.lesson!=='cartesian')out+=robotArc(pts[st.selected],axes[st.selected],st.selected<3?9:6);
  const offsets=[[-30,78],[-105,-8],[-50,-55],[45,-45],[78,-12],[90,33]];
  for(let i=0;i<6;i++)out+=act('joint',tag(pts[i],...offsets[i],robotTranslations[robotLanguage].jointTags[i],st.lesson==='cartesian'?Math.abs(st.commandQ[i]-st.previous[i])>AR3Model.rad(.05):st.selected===i),`data-joint="${i}"`);
  return out;
}

<script>
const robotInitial={q:[...AR3Model.home],commandQ:[...AR3Model.home],selected:0,frame:0,inside:false,grip:false,running:false,lesson:'joint',target:null,version:0,last:['initial'],previous:[...AR3Model.home]};
let robotFlashMessage=null;
function robotFlash(key,params={}){
  robotFlashMessage=[key,params];robotUI.flash(robotT(key,params));
}
function robotSelect(index){
  if(!Number.isInteger(index)||index<0||index>5)return;
  robotUI.st.selected=index;robotUI.st.last=['selected',{joint:index+1}];robotUI.render();
}
function robotMove(q,message){
  const st=robotUI.st;
  if(st.running){robotFlash('busy');return false;}
  if(!AR3Model.within(q)){robotFlash('invalid');return false;}
  const from=[...st.q],version=++st.version;st.previous=from;st.commandQ=[...q];st.running=true;st.last=message;
  const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?.06:2;let elapsed=0;
  robotUI.animate(dt=>{
    if(version!==st.version)return false;
    elapsed+=dt;const t=Math.min(1,elapsed/duration);st.q=AR3Model.lerp(from,q,ease(t));
    if(t===1){st.q=[...q];st.running=false;return false;}return true;
  });return true;
}
function robotJog(delta){
  const st=robotUI.st,i=st.selected,q=[...st.q],raw=q[i]+AR3Model.rad(delta);
  q[i]=AR3Model.clamp(raw,...AR3Model.ranges[i]);st.target=null;
  if(Math.abs(q[i]-st.q[i])<1e-8){robotFlash('boundary');return;}
  robotMove(q,['jog',{joint:i+1,delta:`${delta>0?'+':''}${delta}`,limited:q[i]!==raw}]);
}
function robotReset(){
  const st=robotUI.st;st.version++;st.running=false;st.q=[...AR3Model.home];st.commandQ=[...st.q];st.previous=[...st.q];st.selected=0;st.grip=false;st.target=null;
  st.last=['reset'];robotUI.render();
}
function robotCartesian(axis,delta){
  const st=robotUI.st;if(st.running)return robotFlash('busy');
  const target=[...AR3Model.pose(st.q).tool];target[axis]+=delta/1000;
  const solution=AR3Model.inverse(target,st.q);
  if(!solution){st.target=target;st.last=['noSolution'];robotFlash('noSolutionFlash');robotUI.render();return;}
  st.target=target;robotMove(solution,['cartMove',{axis:'XYZ'[axis],delta:`${delta>0?'+':''}${delta}`}]);
}
const robotLessonKeys={joint:'Joint',cartesian:'Cartesian',flow:'Flow'};
function robotLesson(lesson){
  if(!Object.hasOwn(robotLessonKeys,lesson))return;
  robotUI.st.lesson=lesson;if(lesson==='flow')robotUI.st.inside=true;
  robotUI.st.last=[`lesson${robotLessonKeys[lesson]}`];robotUI.render();
}
const robotUI=mountFigure({
  fig:'01',title:robotT('title'),hint:robotT('subtitle'),size:[91,79,67],palette:'cobalt',state:robotInitial,scene:robotScene,
  buttonsLabel:robotT('tryJoints'),
  buttons:[

  document.querySelector('meta[name="description"]').content=robotT('description');
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
